services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Loopback only: Docker-published ports bypass ufw, and a direct client could forge X-Forwarded-For.
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./data:/app/data
      - ./browser-profiles:/app/.browser-profiles   # Betano session survives restarts
    shm_size: "1gb"                                   # Chromium needs more than Docker's 64MB default

  # Scheduler: settles finished games every hour (no tokens), runs the learning post-mortem daily,
  # builds the day's múltiplas entre jogos once a day,
  # watches lineups and closing prices every tick, writes the Monday discipline report,
  # the optional background refresh every 4h (off unless CRON_ENABLED=1), and asks for the Telegram
  # digest hourly — the server sends it once a day, after TELEGRAM_DIGEST_HOUR. Ticks every 15 min.
  cron:
    image: curlimages/curl:8.10.1
    depends_on: [app]
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 90
        t=0
        while true; do
          [ $$((t % 4)) -eq 0 ]  && curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=settle" >/dev/null || true
          [ $$((t % 4)) -eq 2 ]  && curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=digest" >/dev/null || true
          [ $$((t % 16)) -eq 0 ] && curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh" >/dev/null || true
          # learn and evaluate are called every tick and decide for themselves whether today is done,
          # by asking job_runs. The old "[ $$((t % 96)) -eq 95 ]" lost every deploy day: t restarts at
          # zero with the container and never reached 95, so the product ran zero post-mortems.
          curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=learn" >/dev/null || true
          curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=evaluate" >/dev/null || true
          # Round 3: lineup watch and closing prices every tick, the weekly report hourly (it writes on
          # Mondays), the analytics cleanup daily. Their JSON summaries go to the log.
          curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=lineups"; echo
          curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=close"; echo
          # Brazilian books: prices for every game in the next 48 h, every tick (pre-game only).
          curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=books"; echo
          # Blame per leg and the factor calibration, rebuilt from the ledger every tick (zero tokens).
          curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=attribute"; echo
          # The day's short list: rebuilt from inventory that already exists, every tick, zero tokens.
          curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=today"; echo
          # As múltiplas do dia entre jogos: one cross-game slate per sport with two upcoming games
          # or more. Called every tick and gated on job_runs, like learn and evaluate — a tick
          # counter lives in this shell and resets with the container, which is how the product ran
          # zero post-mortems on every deploy day. CROSS_DAILY=0 switches it off.
          curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=cross"; echo
          [ $$((t % 4)) -eq 1 ]  && { curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=weekly"; echo; }
          [ $$((t % 96)) -eq 50 ] && { curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=cleanup"; echo; }
          t=$$((t + 1)); sleep 900
        done

  # The in-play board, on its own clock and in its own container.
  #
  # It is separate from `cron` for the reason the whole round exists: a live price is worth nothing
  # a minute after it was read, and the main tick sleeps fifteen. This one asks every 60 s (
  # LIVE_BOOKS_INTERVAL overrides), which keeps every game under way inside the freshness window the
  # reader enforces (LIVE_PRICE_MAX_AGE_MS, 90 s by default) — and when nothing is in play the job
  # costs one cached scoreboard read and returns. If this container stops, no stale price is served:
  # the reader simply finds nothing fresh and the live read falls back to saying it has no live price.
  cron-live:
    image: curlimages/curl:8.10.1
    depends_on: [app]
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 120
        while true; do
          curl -s -X POST -H "x-cron-secret: $$CRON_SECRET" "http://app:3000/api/cron/refresh?job=live-books" >/dev/null || true
          sleep $${LIVE_BOOKS_INTERVAL:-60}
        done
